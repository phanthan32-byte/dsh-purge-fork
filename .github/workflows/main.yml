name: Sync Fork from Upstream

on:
  schedule:
    # 每 6 小时运行一次（UTC 时间：00:00、06:00、12:00、18:00）
    - cron: '0 */6 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动触发测试

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fork Sync
        uses: zwping/fork-sync@v1.6.5
        with:
          # 上游仓库所有者，不是你 fork 的用户名
          owner: YuJunZhiXue
          token: ${{ github.token }}

          # 上游被跟踪分支
          head: master

          # 你 fork 仓库中要保持更新的分支
          base: master

          merge_method: merge
          pr_title: 'Fork Sync: Update from YuJunZhiXue/dsh-purge'
          pr_message: 'Sync master from upstream YuJunZhiXue/dsh-purge'
          ignore_fail: false
          auto_merge: true
          retries: 4
          retry_after: 60
